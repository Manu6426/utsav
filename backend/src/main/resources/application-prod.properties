# Production: managed PostgreSQL. Provide DB_URL / DB_USER / DB_PASS as env vars,
# e.g. on Render/Railway/Fly.io. ddl-auto=update is a Phase 1 convenience —
# the roadmap moves this to Flyway migrations before real traffic.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
