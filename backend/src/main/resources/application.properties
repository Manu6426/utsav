# Utsav API — shared settings. Profile-specific database config lives in
# application-dev.properties (H2, zero setup) and application-prod.properties
# (PostgreSQL). Select with APP_PROFILE=dev|prod (defaults to dev).
spring.application.name=utsav-api
spring.profiles.active=${APP_PROFILE:dev}

# Frontend origins allowed to call /api/** (comma-separated for prod)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:8000,http://127.0.0.1:8000}

# Pretty JSON dates
spring.jackson.time-zone=UTC

# Render/Heroku-style platforms inject $PORT — default keeps local runs on 8080
server.port=${PORT:8080}
